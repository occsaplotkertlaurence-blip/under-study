<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grade Form</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <form id="gradeForm" ></form>
        <h1>Grade Form</h1>

        <!-- TextField -->
        <label for="studentName">Student name</label>
        <input type="text" id="studentName" name="studentName" maxlength="40" placeholder="Enter student name">
        <br></br>
        <!-- Number field -->
        <label for="score">Score (0 to 100)</label>
        <input type="number" id="score" name="score" min="0" max="100" placeholder="Enter score">
        <br></br>
        <!-- Select option -->
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
            <option value="" selected disabled>Select a subject</option>
            <option value="Math">Math</option>
            <option value="Science">Science</option>
            <option value="English">English</option>
            <option value="History">History</option>
        </select>
        <br></br>

        <!-- Radio buttons -->
        <fieldset>
            <br>Term</br>
            <label class="inline"><input type="radio" name="term" value="1st"> 1st term</label>
            <label class="inline"><input type="radio" name="term" value="2nd"> 2nd term</label>
            <label class="inline"><input type="radio" name="term" value="3rd"> 3rd term</label>
        </fieldset>
        <br></br>
        <!-- Text area -->
        <label for="remarks">Remarks (optional)</label>
        <textarea id="remarks" name="remarks" rows="4" maxlength="120" placeholder="Add a short note"></textarea>
         
        <br></br>
        <!-- Checkbox -->
        <label class="inline"><input type="checkbox" id="confirm" name="confirm"> I confirm this score is correct</label>

        <button type="submit">Calculate grade</button>
        
        <p id="result" role="status"></p>
    </form>

    <script src="validation.js"></script>
</body>

</html>
